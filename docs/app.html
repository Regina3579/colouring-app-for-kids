<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe8c2">
<title>Coloring Fun — Color &amp; Draw</title>
<style>
  :root{
    --pink:#ff7db9; --purple:#a874f2; --blue:#5c99ff; --green:#52cc80;
    --orange:#ff9e40; --teal:#33c7c7; --red:#ff7379; --yellow:#ffcc40;
    --ink:#332e4d; --card:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"SF Pro Rounded",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#fff7dc 0%,#dcefff 100%);
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }

  /* ---------- Gallery (categories + pictures) ---------- */
  .gallery{height:100dvh;overflow-y:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom));display:none;}
  .gallery.active{display:block;}
  .gallery-head{display:flex;align-items:center;gap:10px;justify-content:center;position:relative;padding:10px 44px 14px;}
  .gallery-head h1{
    margin:0;font-size:clamp(24px,5.5vw,40px);font-weight:900;text-align:center;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
    -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px;
  }
  .gallery-head .gback{position:absolute;left:2px;top:6px;}
  .subtitle{text-align:center;font-weight:700;color:#7a769a;margin:-4px 0 16px;font-size:clamp(13px,3vw,16px);}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
    gap:15px;max-width:1240px;margin:0 auto;
  }
  .card{
    background:var(--card);border-radius:24px;padding:10px;cursor:pointer;position:relative;
    border:5px solid #fff;box-shadow:0 6px 15px rgba(0,0,0,.10);
    transition:transform .12s ease;
  }
  .card:active{transform:scale(.95);}
  .card .thumb{width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#fff;display:grid;place-items:center;}
  .card .thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .card.cat .thumb{background:var(--tint,#faf7ff);}
  .card .label{text-align:center;font-weight:800;margin-top:8px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .count{text-align:center;font-size:12px;color:#9a96b4;font-weight:700;}
  .pro-badge{position:absolute;top:8px;right:8px;background:linear-gradient(90deg,var(--purple),var(--pink));
    color:#fff;font-size:10px;font-weight:900;padding:3px 7px;border-radius:10px;border:1.5px solid #fff;
    box-shadow:0 2px 5px rgba(0,0,0,.2);letter-spacing:.5px;}

  /* ---------- Coloring screen ---------- */
  .screen{height:100dvh;display:none;flex-direction:column;}
  .screen.active{display:flex;}
  .topbar{
    display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
    background:rgba(255,255,255,.7);backdrop-filter:blur(8px);
  }
  .topbar .title{font-weight:900;font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .iconbtn{
    border:none;border-radius:50%;width:44px;height:44px;flex:0 0 auto;
    font-size:20px;font-weight:800;color:#fff;cursor:pointer;display:grid;place-items:center;
    box-shadow:0 3px 8px rgba(0,0,0,.18);
  }
  .iconbtn:active{transform:scale(.9);}
  .iconbtn.back{background:linear-gradient(180deg,#8fb5ff,var(--blue));}
  .iconbtn.undo{background:linear-gradient(180deg,#ffd36e,var(--orange));}
  .iconbtn.clear{background:linear-gradient(180deg,#ff9aa0,var(--red));}
  .iconbtn.save{background:linear-gradient(180deg,#7fe0a6,var(--green));}

  .stage{flex:1;min-height:0;display:grid;place-items:center;padding:10px;position:relative;}
  #paper{background:#fff;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.14);touch-action:none;display:block;border:4px solid #fff;}
  .spinner{position:absolute;font-weight:800;color:#a29ec0;font-size:16px;}

  /* ---------- Bottom controls ---------- */
  .dock{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);padding:8px 10px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06);}
  .tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .tool{border:none;background:#f0ecfb;border-radius:16px;padding:7px 10px;min-width:58px;font-size:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);transition:transform .1s;}
  .tool small{font-size:10px;font-weight:800;}
  .tool.sel{background:linear-gradient(180deg,var(--purple),var(--pink));color:#fff;box-shadow:0 3px 8px rgba(168,116,242,.4);}
  .tool:active{transform:scale(.92);}
  .paltabs{display:flex;justify-content:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .paltab{border:none;background:#eee9fb;border-radius:12px;padding:5px 14px;font-weight:800;font-size:13px;cursor:pointer;color:#6a4bd1;}
  .paltab.sel{background:var(--purple);color:#fff;}
  .swatches{display:flex;gap:10px;overflow-x:auto;padding:4px 6px 6px;scrollbar-width:none;justify-content:safe center;}
  .swatches::-webkit-scrollbar{display:none;}
  .sw{flex:0 0 auto;width:40px;height:40px;border-radius:50%;cursor:pointer;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);}
  .sw.sel{outline:4px solid var(--purple);outline-offset:1px;transform:scale(1.08);}
  .sizewrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;}
  .sizewrap input{width:min(60vw,240px);}
  .sizewrap label{font-weight:800;font-size:12px;color:#7a769a;}
  .hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(51,46,77,.85);color:#fff;padding:8px 16px;border-radius:20px;font-weight:700;font-size:14px;pointer-events:none;transition:opacity .5s;white-space:nowrap;}
</style>
</head>
<body>

<!-- CATEGORIES -->
<div class="gallery active" id="catView">
  <div class="gallery-head"><h1>🎨 Coloring Fun</h1></div>
  <div class="subtitle">Pick a theme to start colouring!</div>
  <div class="grid" id="catGrid"></div>
</div>

<!-- PICTURES IN A CATEGORY -->
<div class="gallery" id="picView">
  <div class="gallery-head">
    <button class="iconbtn back gback" id="picBack">‹</button>
    <h1 id="picTitle">Pictures</h1>
  </div>
  <div class="grid" id="picGrid"></div>
</div>

<!-- COLORING -->
<div class="screen" id="screen">
  <div class="topbar">
    <button class="iconbtn back" id="backBtn" title="Back">‹</button>
    <div class="title" id="screenTitle">Coloring</div>
    <button class="iconbtn undo" id="undoBtn" title="Undo">↺</button>
    <button class="iconbtn clear" id="clearBtn" title="Clear">🗑️</button>
    <button class="iconbtn save" id="saveBtn" title="Save">⤓</button>
  </div>
  <div class="stage">
    <canvas id="paper" width="1000" height="1000"></canvas>
    <div class="spinner" id="spinner" style="display:none">Loading…</div>
    <div class="hint" id="hint">Tap any part to fill it in ✨</div>
  </div>
  <div class="dock">
    <div class="tools" id="tools"></div>
    <div class="paltabs" id="paltabs"></div>
    <div class="swatches" id="swatches"></div>
    <div class="sizewrap"><label>Size</label><input type="range" id="size" min="6" max="90" value="26"></div>
  </div>
</div>

<script>
/* ============================================================
   Coloring Fun — Web edition (uses the app's real artwork)
   ============================================================ */

/* ---------- Categories & pictures (mirrors the iOS app) ---------- */
const PRO = new Set([
  'fairy_rainbow','fairy_ballerina','fairy_mermaid','fairy_winter',
  'unicorn_mermaid','unicorn_fairy','unicorn_pegacorn',
  'princess_butterfly','princess_mermaid',
]);
const CATEGORIES = [
  { id:'animals', name:'Animals', emoji:'🐾', thumb:'cat_animals', tint:'#ffdbb8', items:[
    ['lion','Lion','🦁'],['elephant','Elephant','🐘'],['rabbit','Rabbit','🐰'],['tiger','Tiger','🐯'],
    ['giraffe','Giraffe','🦒'],['monkey','Monkey','🐵'],['panda','Panda','🐼'],['fox','Fox','🦊'],
    ['dog','Puppy','🐶'],['cat','Kitten','🐱'] ]},
  { id:'dinosaurs', name:'Dinosaurs', emoji:'🦕', thumb:'cat_dinosaurs', tint:'#c7ebc7', items:[
    ['trex','T-Rex','🦖'],['triceratops','Triceratops','🦕'],['stegosaurus','Stegosaurus','🦕'],
    ['brachiosaurus','Brachiosaurus','🦕'],['ankylosaurus','Ankylosaurus','🦕'],['brontosaurus','Diplodocus','🦕'],
    ['parasaurolophus','Parasaurolophus','🦕'],['velociraptor','Velociraptor','🦖'],
    ['spinosaurus','Spinosaurus','🦖'],['pterodactyl','Pteranodon','🦖'] ]},
  { id:'birds', name:'Birds', emoji:'🐦', thumb:'cat_birds', tint:'#cce9fa', items:[
    ['bird_parrot','Parrot','🦜'],['bird_owl','Owl','🦉'],['bird_peacock','Peacock','🦚'],
    ['bird_penguin','Penguin','🐧'],['bird_flamingo','Flamingo','🦩'],['bird_sparrow','Sparrow','🐦'],
    ['bird_toucan','Toucan','🦜'],['bird_duck','Duck','🦆'],['bird_chicken','Chicken','🐔'],
    ['bird_bluebird','Bluebird','🐦'] ]},
  { id:'fairy', name:'Fairy', emoji:'🧚', thumb:'cat_fairy', tint:'#e6d6ff', items:[
    ['fairy_flower','Flower Fairy','🧚'],['fairy_butterfly','Butterfly Fairy','🧚'],['fairy_rainbow','Rainbow Fairy','🧚'],
    ['fairy_princess','Princess Fairy','🧚'],['fairy_garden','Garden Fairy','🧚'],['fairy_star','Star Fairy','🧚'],
    ['fairy_ballerina','Ballerina Fairy','🧚'],['fairy_forest','Woodland Fairy','🧚'],
    ['fairy_mermaid','Mermaid Fairy','🧚'],['fairy_winter','Snow Fairy','🧚'] ]},
  { id:'unicorn', name:'Unicorn', emoji:'🦄', thumb:'cat_unicorn', tint:'#f5d6ff', items:[
    ['unicorn_rainbow','Rainbow Unicorn','🦄'],['unicorn_princess','Princess Unicorn','🦄'],['unicorn_baby','Baby Unicorn','🦄'],
    ['unicorn_pegacorn','Pegacorn','🦄'],['unicorn_flower','Flower Unicorn','🦄'],['unicorn_mermaid','Mermaid Unicorn','🦄'],
    ['unicorn_galaxy','Galaxy Unicorn','🦄'],['unicorn_crystal','Crystal Unicorn','🦄'],
    ['unicorn_snow','Snow Unicorn','🦄'],['unicorn_fairy','Fairy Unicorn','🦄'] ]},
  { id:'princess', name:'Princess', emoji:'👸', thumb:'cat_princess', tint:'#ffd1e3', items:[
    ['princess_golden','Golden Princess','👑'],['princess_royal','Royal Princess','👸'],['princess_swan','Swan Princess','🦢'],
    ['princess_moon','Moon Princess','🌙'],['princess_sunshine','Sunshine Princess','☀️'],['princess_ocean','Ocean Princess','🌊'],
    ['princess_rose','Rose Princess','🌹'],['princess_snow','Snow Princess','❄️'],
    ['princess_butterfly','Butterfly Princess','🦋'],['princess_mermaid','Mermaid Princess','🧜‍♀️'] ]},
  { id:'cars', name:'Cars', emoji:'🚗', thumb:'cat_cars', tint:'#d1e0f5', items:[
    ['car_race','Race Car','🏎️'],['car_sports','Sports Car','🚗'],['car_monster','Monster Truck','🚚'],
    ['car_police','Police Car','🚓'],['car_convertible','Convertible','🚗'],['car_beetle','Beetle','🚙'],
    ['car_taxi','Taxi','🚕'],['car_jeep','Jeep','🚙'],['car_family','Family Car','🚐'],['car_electric','Electric Car','🔋'] ]},
  { id:'transport', name:'Transport', emoji:'🚍', thumb:'cat_transport', tint:'#ffe0bd', items:[
    ['tr_firetruck','Fire Truck','🚒'],['tr_icecream','Ice Cream Truck','🍦'],['tr_schoolbus','School Bus','🚌'],
    ['tr_towtruck','Tow Truck','🛻'],['tr_dumptruck','Dump Truck','🚛'],['tr_train','Train','🚆'],
    ['tr_rocket','Rocket','🚀'],['tr_tractor','Tractor','🚜'],['tr_sailboat','Sailboat','⛵'],['tr_ship','Ship','🚢'] ]},
];

/* ---------- Palette ---------- */
const PALETTES = {
  'Colours':['#2e2b45','#8a8aa0','#ffffff','#ff4d4d','#ff8c3b','#ffcc33','#7ed957','#33c7a1','#3ba7ff','#3b5bff','#a44bff','#ff5bb0','#ff9ec4','#8b5a2b','#c8905a'],
  'Pastel':['#ffd1dc','#ffe0b3','#fff5b8','#d6f5c8','#c8f0ee','#cfe4ff','#e2d1ff','#f3d1ff','#ffd9ec','#e8e4d0','#d9c7ff','#c4f2df'],
  'Bright':['#ff005c','#ff6f00','#ffe600','#00e676','#00e5ff','#2979ff','#7c4dff','#ff4081','#f50057','#00bfa5','#ff3d00','#651fff'],
};

/* ---------- State ---------- */
const canvas = document.getElementById('paper');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let W = 1000, H = 1000;
let tool='fill', color='#ff4d4d', paltab='Colours', brushSize=26;
let drawing=false, last=null;
let outlineImg=null;
const undoStack=[];

/* ---------- Views ---------- */
const catView=document.getElementById('catView');
const picView=document.getElementById('picView');
const screen=document.getElementById('screen');
function show(view){
  catView.classList.toggle('active', view==='cat');
  picView.classList.toggle('active', view==='pic');
  screen.classList.toggle('active', view==='screen');
}

/* ---------- Build categories ---------- */
const catGrid=document.getElementById('catGrid');
CATEGORIES.forEach(cat=>{
  const card=document.createElement('div'); card.className='card cat'; card.style.setProperty('--tint',cat.tint);
  card.innerHTML=`<div class="thumb"><img loading="lazy" src="pages/${cat.thumb}.png" alt=""></div>
    <div class="label">${cat.emoji} ${cat.name}</div><div class="count">${cat.items.length} pictures</div>`;
  card.onclick=()=>openCategory(cat);
  catGrid.appendChild(card);
});

/* ---------- Build pictures for a category ---------- */
const picGrid=document.getElementById('picGrid');
function openCategory(cat){
  document.getElementById('picTitle').textContent=`${cat.emoji} ${cat.name}`;
  picGrid.innerHTML='';
  cat.items.forEach(([id,title,emoji])=>{
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`<div class="thumb"><img loading="lazy" src="pages/${id}.png" alt=""></div>
      <div class="label">${emoji} ${title}</div>${PRO.has(id)?'<div class="pro-badge">PRO</div>':''}`;
    card.onclick=()=>openPage(id,title,emoji);
    picGrid.appendChild(card);
  });
  show('pic'); picView.scrollTop=0;
}
document.getElementById('picBack').onclick=()=>show('cat');

/* ---------- Tools ---------- */
const TOOLS=[
  {id:'fill',icon:'🪣',name:'Fill'},{id:'brush',icon:'🖌️',name:'Brush'},{id:'crayon',icon:'🖍️',name:'Crayon'},
  {id:'glitter',icon:'✨',name:'Glitter'},{id:'sparkle',icon:'🌟',name:'Sparkle'},{id:'eraser',icon:'🧽',name:'Eraser'},
];
const toolsEl=document.getElementById('tools');
TOOLS.forEach(t=>{
  const b=document.createElement('button'); b.className='tool'+(t.id===tool?' sel':''); b.dataset.id=t.id;
  b.innerHTML=`<span>${t.icon}</span><small>${t.name}</small>`;
  b.onclick=()=>{tool=t.id;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('sel',x.dataset.id===tool));};
  toolsEl.appendChild(b);
});

/* ---------- Palette ---------- */
const paltabsEl=document.getElementById('paltabs'), swatchesEl=document.getElementById('swatches');
Object.keys(PALETTES).forEach(name=>{
  const b=document.createElement('button'); b.className='paltab'+(name===paltab?' sel':''); b.textContent=name;
  b.onclick=()=>{paltab=name;document.querySelectorAll('.paltab').forEach(x=>x.classList.toggle('sel',x.textContent===paltab));renderSwatches();};
  paltabsEl.appendChild(b);
});
function renderSwatches(){
  swatchesEl.innerHTML='';
  PALETTES[paltab].forEach(hex=>{
    const s=document.createElement('div'); s.className='sw'+(hex===color?' sel':''); s.style.background=hex;
    if(hex==='#ffffff') s.style.border='4px solid #ddd';
    s.onclick=()=>{color=hex;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));s.classList.add('sel');};
    swatchesEl.appendChild(s);
  });
}
renderSwatches();
document.getElementById('size').oninput=e=>brushSize=+e.target.value;

/* ---------- Open a coloring page ---------- */
let currentTitle='';
function openPage(id,title,emoji){
  currentTitle=title;
  document.getElementById('screenTitle').textContent=`${emoji} ${title}`;
  show('screen');
  const spinner=document.getElementById('spinner'); spinner.style.display='block';
  const hint=document.getElementById('hint'); hint.style.opacity='0';
  const img=new Image();
  img.onload=()=>{
    outlineImg=img;
    let w=img.naturalWidth, h=img.naturalHeight;
    canvas.width=w; canvas.height=h; W=w; H=h;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    ctx.drawImage(img,0,0,W,H);
    undoStack.length=0;
    spinner.style.display='none';
    hint.style.opacity='1'; setTimeout(()=>hint.style.opacity='0',2200);
    resizeCanvas();
  };
  img.onerror=()=>{ spinner.textContent='Could not load picture'; };
  img.src='pages/'+id+'.png';
}
document.getElementById('backBtn').onclick=()=>show('pic');

/* ---------- Undo / Clear / Save ---------- */
function pushUndo(){ try{ undoStack.push(ctx.getImageData(0,0,W,H)); if(undoStack.length>8)undoStack.shift(); }catch(e){} }
document.getElementById('undoBtn').onclick=()=>{const s=undoStack.pop(); if(s)ctx.putImageData(s,0,0);};
document.getElementById('clearBtn').onclick=()=>{ pushUndo(); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); if(outlineImg)ctx.drawImage(outlineImg,0,0,W,H); };
document.getElementById('saveBtn').onclick=()=>{const a=document.createElement('a'); a.download=(currentTitle||'coloring')+'.png'; a.href=canvas.toDataURL('image/png'); a.click();};

/* ---------- Responsive canvas ---------- */
function resizeCanvas(){
  const stage=document.querySelector('.stage'); const pad=18;
  const availW=stage.clientWidth-pad, availH=stage.clientHeight-pad;
  const scale=Math.min(availW/W, availH/H);
  canvas.style.width=Math.max(80,W*scale)+'px';
  canvas.style.height=Math.max(80,H*scale)+'px';
}
window.addEventListener('resize',()=>{ if(screen.classList.contains('active')) resizeCanvas(); });

/* ---------- Pointer → canvas coords ---------- */
function pos(e){
  const r=canvas.getBoundingClientRect(); const p=e.touches?e.touches[0]:e;
  return { x:Math.round((p.clientX-r.left)/r.width*W), y:Math.round((p.clientY-r.top)/r.height*H) };
}

/* ---------- Flood fill ---------- */
function hexRGB(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}
function floodFill(sx,sy,fill){
  if(sx<0||sy<0||sx>=W||sy>=H)return;
  const img=ctx.getImageData(0,0,W,H); const d=img.data;
  const at=(x,y)=>(y*W+x)<<2;
  const si=at(sx,sy); const sr=d[si],sg=d[si+1],sb=d[si+2];
  if(sr+sg+sb<210)return;                       // tapped an outline — ignore
  if(sr===fill.r&&sg===fill.g&&sb===fill.b)return;
  const TOL=60*60;
  const match=i=>{const a=d[i]-sr,b=d[i+1]-sg,c=d[i+2]-sb;return a*a+b*b+c*c<=TOL;};
  const stack=[[sx,sy]];
  while(stack.length){
    let [x,y]=stack.pop(); let i=at(x,y);
    while(y>0&&match(i-W*4)){y--;i-=W*4;}
    let up=false,dn=false;
    while(y<H&&match(i)){
      d[i]=fill.r;d[i+1]=fill.g;d[i+2]=fill.b;d[i+3]=255;
      if(x>0){ if(match(i-4)){ if(!up){stack.push([x-1,y]);up=true;} } else up=false; }
      if(x<W-1){ if(match(i+4)){ if(!dn){stack.push([x+1,y]);dn=true;} } else dn=false; }
      y++;i+=W*4;
    }
  }
  ctx.putImageData(img,0,0);
}

/* ---------- Sparkle drawing ---------- */
function star(x,y,r,col){
  ctx.save(); ctx.translate(x,y); ctx.fillStyle=col; ctx.beginPath();
  for(let i=0;i<8;i++){const a=i*Math.PI/4;const rad=i%2?r:r*0.4;ctx[i?'lineTo':'moveTo'](Math.cos(a)*rad,Math.sin(a)*rad);}
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha=0.9; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,r*0.18,0,7); ctx.fill(); ctx.restore();
}

/* ---------- Freehand strokes ---------- */
function stampTo(x,y){
  if(tool==='eraser'){
    ctx.save(); ctx.strokeStyle='#fff'; ctx.fillStyle='#fff'; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=brushSize*1.6;
    if(last){ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(x,y);ctx.stroke();}
    ctx.beginPath(); ctx.arc(x,y,brushSize*0.8,0,7); ctx.fill(); ctx.restore();
    if(outlineImg){ ctx.save(); ctx.globalCompositeOperation='multiply'; ctx.drawImage(outlineImg,0,0,W,H); ctx.restore(); }
    return;
  }
  if(tool==='glitter'||tool==='sparkle'){
    const big=tool==='sparkle'; const count=big?2:4;
    for(let k=0;k<count;k++){
      const jx=x+(Math.random()-0.5)*brushSize, jy=y+(Math.random()-0.5)*brushSize;
      star(jx,jy,(big?0.5:0.28)*brushSize*(0.6+Math.random()*0.6), Math.random()<0.4?'#fff':color);
    }
    return;
  }
  ctx.save(); ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=brushSize;
  if(tool==='crayon'){ctx.globalAlpha=0.55;ctx.lineWidth=brushSize*0.9;}
  if(last){ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(x,y);ctx.stroke();}
  ctx.beginPath(); ctx.arc(x,y,ctx.lineWidth/2,0,7); ctx.fill();
  if(tool==='crayon'){for(let k=0;k<6;k++){const a=Math.random()*7,rr=Math.random()*brushSize*0.5;ctx.globalAlpha=0.25;ctx.beginPath();ctx.arc(x+Math.cos(a)*rr,y+Math.sin(a)*rr,1.5,0,7);ctx.fill();}}
  ctx.restore();
}

/* ---------- Input ---------- */
function down(e){
  e.preventDefault(); const {x,y}=pos(e); pushUndo();
  if(tool==='fill'){ floodFill(x,y,hexRGB(color)); return; }
  drawing=true; last={x,y}; stampTo(x,y); last={x,y};
}
function move(e){ if(!drawing)return; e.preventDefault(); const {x,y}=pos(e); stampTo(x,y); last={x,y}; }
function up(){ drawing=false; last=null; }
canvas.addEventListener('mousedown',down);
canvas.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
canvas.addEventListener('touchstart',down,{passive:false});
canvas.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',up);
</script>
</body>
