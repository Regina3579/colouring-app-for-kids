<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe8c2">
<title>Coloring Fun — Color &amp; Draw</title>
<style>
  :root{
    --pink:#ff7db9; --purple:#a874f2; --blue:#5c99ff; --green:#52cc80;
    --orange:#ff9e40; --teal:#33c7c7; --red:#ff7379; --yellow:#ffcc40;
    --ink:#332e4d; --card:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"SF Pro Rounded",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#fff7dc 0%,#dcefff 100%);
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  #app{height:100dvh;display:flex;flex-direction:column;}

  /* ---------- Gallery ---------- */
  .gallery{height:100dvh;overflow-y:auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom));}
  .gallery-header{text-align:center;padding:12px 8px 18px;}
  .gallery-header h1{
    margin:0;font-size:clamp(28px,6vw,44px);font-weight:900;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
    -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px;
  }
  .gallery-header p{margin:6px 0 0;font-weight:600;color:#7a769a;font-size:clamp(13px,3vw,17px);}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:16px;max-width:1200px;margin:0 auto;
  }
  .card{
    background:var(--card);border-radius:26px;padding:12px;cursor:pointer;
    border:5px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.10);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:active{transform:scale(.95);}
  .card .thumb{width:100%;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#faf7ff;display:block;}
  .card .thumb canvas{width:100%;height:100%;display:block;}
  .card .label{text-align:center;font-weight:800;margin-top:10px;font-size:16px;}

  /* ---------- Coloring screen ---------- */
  .screen{height:100dvh;display:none;flex-direction:column;}
  .screen.active{display:flex;}
  .topbar{
    display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
    background:rgba(255,255,255,.7);backdrop-filter:blur(8px);
  }
  .topbar .title{font-weight:900;font-size:18px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .iconbtn{
    border:none;border-radius:50%;width:44px;height:44px;flex:0 0 auto;
    font-size:20px;font-weight:800;color:#fff;cursor:pointer;display:grid;place-items:center;
    box-shadow:0 3px 8px rgba(0,0,0,.18);
  }
  .iconbtn:active{transform:scale(.9);}
  .iconbtn.back{background:linear-gradient(180deg,#8fb5ff,var(--blue));}
  .iconbtn.undo{background:linear-gradient(180deg,#ffd36e,var(--orange));}
  .iconbtn.clear{background:linear-gradient(180deg,#ff9aa0,var(--red));}
  .iconbtn.save{background:linear-gradient(180deg,#7fe0a6,var(--green));}

  .stage{flex:1;min-height:0;display:grid;place-items:center;padding:10px;position:relative;}
  #paper{
    background:#fff;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.14);
    touch-action:none;display:block;border:4px solid #fff;
  }

  /* ---------- Bottom controls ---------- */
  .dock{
    background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
    padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(0,0,0,.06);
  }
  .tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .tool{
    border:none;background:#f0ecfb;border-radius:16px;padding:8px 10px;min-width:60px;
    font-size:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--ink);transition:transform .1s;
  }
  .tool small{font-size:10px;font-weight:800;}
  .tool.sel{background:linear-gradient(180deg,var(--purple),var(--pink));color:#fff;box-shadow:0 3px 8px rgba(168,116,242,.4);}
  .tool:active{transform:scale(.92);}

  .paltabs{display:flex;justify-content:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .paltab{border:none;background:#eee9fb;border-radius:12px;padding:5px 14px;font-weight:800;font-size:13px;cursor:pointer;color:#6a4bd1;}
  .paltab.sel{background:var(--purple);color:#fff;}

  .swatches{display:flex;gap:10px;overflow-x:auto;padding:4px 6px 6px;scrollbar-width:none;justify-content:safe center;}
  .swatches::-webkit-scrollbar{display:none;}
  .sw{
    flex:0 0 auto;width:42px;height:42px;border-radius:50%;cursor:pointer;
    border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);position:relative;
  }
  .sw.sel{outline:4px solid var(--purple);outline-offset:1px;transform:scale(1.08);}
  .sizewrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;}
  .sizewrap input{width:min(60vw,240px);}
  .sizewrap label{font-weight:800;font-size:12px;color:#7a769a;}

  .hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(51,46,77,.85);
    color:#fff;padding:8px 16px;border-radius:20px;font-weight:700;font-size:14px;pointer-events:none;
    transition:opacity .5s;white-space:nowrap;}
</style>
</head>
<body>
<div id="app">

  <!-- GALLERY -->
  <div class="gallery" id="gallery">
    <div class="gallery-header">
      <h1>🎨 Coloring Fun</h1>
      <p>Pick a picture and tap to color!</p>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- COLORING -->
  <div class="screen" id="screen">
    <div class="topbar">
      <button class="iconbtn back" id="backBtn" title="Back">‹</button>
      <div class="title" id="screenTitle">Coloring</div>
      <button class="iconbtn undo" id="undoBtn" title="Undo">↺</button>
      <button class="iconbtn clear" id="clearBtn" title="Clear">🗑️</button>
      <button class="iconbtn save" id="saveBtn" title="Save">⤓</button>
    </div>

    <div class="stage">
      <canvas id="paper" width="1000" height="1000"></canvas>
      <div class="hint" id="hint">Tap any part to fill it in ✨</div>
    </div>

    <div class="dock">
      <div class="tools" id="tools"></div>
      <div class="paltabs" id="paltabs"></div>
      <div class="swatches" id="swatches"></div>
      <div class="sizewrap">
        <label>Size</label>
        <input type="range" id="size" min="6" max="90" value="26">
      </div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   Coloring Fun — Web edition
   Tap-to-fill (flood fill) + brush / crayon / glitter / sparkle
   / eraser tools, color palette, undo, clear, save.
   ============================================================ */

const W = 1000, H = 1000;
const canvas = document.getElementById('paper');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

/* ---------- Coloring pages (outline drawings) ---------- */
function whiteBg(c){ c.fillStyle='#fff'; c.fillRect(0,0,W,H); }
function base(c){ c.strokeStyle='#2e2b45'; c.lineWidth=8; c.lineJoin='round'; c.lineCap='round'; }
function circle(c,x,y,r){ c.beginPath(); c.arc(x,y,r,0,7); c.stroke(); }
function ellipse(c,x,y,rx,ry,rot=0){ c.beginPath(); c.ellipse(x,y,rx,ry,rot,0,7); c.stroke(); }
function line(c,x1,y1,x2,y2){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }
function poly(c,pts,close=true){ c.beginPath(); c.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]); if(close)c.closePath(); c.stroke(); }

const PAGES = [
  { emoji:'🦋', name:'Butterfly', draw(c){ base(c);
    ellipse(c,500,500,26,180);                     // body
    ellipse(c,500,340,20,26);                       // head
    line(c,492,320,455,250); line(c,508,320,545,250); circle(c,452,244,12); circle(c,548,244,12);
    ellipse(c,360,410,140,120,-0.35); ellipse(c,640,410,140,120,0.35);   // upper wings
    ellipse(c,375,640,120,140,0.35); ellipse(c,625,640,120,140,-0.35);   // lower wings
    circle(c,345,400,34); circle(c,655,400,34); circle(c,372,650,26); circle(c,628,650,26);
  }},
  { emoji:'🌸', name:'Flower', draw(c){ base(c);
    for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; ellipse(c,500+Math.cos(a)*185,430+Math.sin(a)*185,80,55,a); }
    circle(c,500,430,90);                           // center
    line(c,500,520,500,860);                         // stem
    ellipse(c,395,680,90,45,-0.5); ellipse(c,605,720,90,45,0.5); // leaves
  }},
  { emoji:'🐠', name:'Fish', draw(c){ base(c);
    ellipse(c,470,500,250,160);                      // body
    poly(c,[[700,500],[880,360],[880,640]]);         // tail
    circle(c,360,455,26);                            // eye
    ellipse(c,470,690,90,50,0.2);                    // bottom fin
    poly(c,[[470,340],[560,300],[520,380]]);         // top fin
    line(c,255,430,205,410); line(c,250,500,195,500); line(c,255,570,205,590); // bubbles-ish mouth lines
    circle(c,150,360,20); circle(c,110,290,14);      // bubbles
  }},
  { emoji:'🐱', name:'Kitty', draw(c){ base(c);
    circle(c,500,430,210);                           // head
    poly(c,[[350,300],[300,150],[470,270]]);         // ear L
    poly(c,[[650,300],[700,150],[530,270]]);         // ear R
    circle(c,430,420,26); circle(c,570,420,26);      // eyes
    poly(c,[[480,470],[520,470],[500,505]]);         // nose
    line(c,500,505,500,540); line(c,500,540,455,565); line(c,500,540,545,565); // mouth
    line(c,300,470,170,440); line(c,300,500,165,500); line(c,300,530,170,560); // whiskers L
    line(c,700,470,830,440); line(c,700,500,835,500); line(c,700,530,830,560); // whiskers R
    ellipse(c,500,780,190,120);                       // body
  }},
  { emoji:'🏠', name:'House', draw(c){ base(c);
    poly(c,[[250,480],[250,820],[750,820],[750,480]]); // walls
    poly(c,[[210,480],[500,250],[790,480]]);           // roof
    poly(c,[[430,820],[430,650],[570,650],[570,820]]); // door
    circle(c,545,735,10);                              // knob
    poly(c,[[300,540],[300,640],[400,640],[400,540]]); // window
    line(c,350,540,350,640); line(c,300,590,400,590);
    poly(c,[[640,150],[640,330],[700,330],[700,210]]); // chimney
    circle(c,820,220,70);                              // sun
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2; line(c,820+Math.cos(a)*80,220+Math.sin(a)*80,820+Math.cos(a)*115,220+Math.sin(a)*115);}
  }},
  { emoji:'☀️', name:'Sun', draw(c){ base(c);
    circle(c,500,500,220);
    for(let i=0;i<12;i++){const a=i/12*Math.PI*2; poly(c,[[500+Math.cos(a-0.06)*230,500+Math.sin(a-0.06)*230],[500+Math.cos(a)*340,500+Math.sin(a)*340],[500+Math.cos(a+0.06)*230,500+Math.sin(a+0.06)*230]]);}
    circle(c,430,460,20); circle(c,570,460,20);        // eyes
    c.beginPath(); c.arc(500,540,90,0.15*Math.PI,0.85*Math.PI); c.stroke(); // smile
  }},
  { emoji:'❤️', name:'Heart', draw(c){ base(c);
    c.beginPath();
    c.moveTo(500,780); c.bezierCurveTo(140,520,220,220,420,300);
    c.bezierCurveTo(500,335,500,335,580,300); c.bezierCurveTo(780,220,860,520,500,780);
    c.closePath(); c.stroke();
    ellipse(c,400,430,55,40,-0.4);                     // shine
  }},
  { emoji:'🍦', name:'Ice Cream', draw(c){ base(c);
    poly(c,[[360,540],[640,540],[500,880]]);           // cone
    for(let y=560;y<820;y+=40) line(c,360+(y-540)*0.18,y,640-(y-540)*0.18,y); // waffle-ish
    circle(c,430,470,110); circle(c,580,480,110); circle(c,500,360,120); // scoops
    circle(c,500,250,26);                              // cherry
    line(c,500,224,540,175);
  }},
  { emoji:'🌈', name:'Rainbow', draw(c){ base(c);
    for(let i=0;i<6;i++){ const r=430-i*55; c.beginPath(); c.arc(500,720,r,Math.PI,0); c.stroke(); }
    line(c,70,720,930,720);
    ellipse(c,250,720,120,70); ellipse(c,750,720,120,70); // clouds
    circle(c,205,700,55); circle(c,300,700,55); circle(c,705,700,55); circle(c,800,700,55);
  }},
  { emoji:'⭐', name:'Star', draw(c){ base(c);
    const pts=[]; for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5; const r=i%2?150:330; pts.push([500+Math.cos(a)*r,500+Math.sin(a)*r]);}
    poly(c,pts);
    circle(c,440,440,18); circle(c,560,440,18);        // eyes
    c.beginPath(); c.arc(500,500,70,0.15*Math.PI,0.85*Math.PI); c.stroke();
  }},
  { emoji:'🦄', name:'Unicorn', draw(c){ base(c);
    ellipse(c,470,560,210,180);                        // head
    poly(c,[[470,140],[430,360],[540,360]]);           // horn
    line(c,445,210,528,235); line(c,432,285,540,300);  // horn stripes
    poly(c,[[640,420],[720,330],[690,470]]);           // ear
    circle(c,430,560,24);                              // eye
    ellipse(c,300,600,60,44,0.3);                       // nostril area/muzzle
    circle(c,270,640,10);
    // mane
    c.beginPath(); c.moveTo(560,360);
    c.bezierCurveTo(720,340,760,520,700,600);
    c.bezierCurveTo(800,620,780,780,690,800);
    c.stroke();
    line(c,650,470,720,470); line(c,660,620,740,660);
  }},
  { emoji:'🐢', name:'Turtle', draw(c){ base(c);
    ellipse(c,500,520,240,180);                        // shell
    ellipse(c,500,520,140,100);                        // inner shell
    for(let i=0;i<6;i++){const a=i/6*Math.PI*2; line(c,500+Math.cos(a)*140,520+Math.sin(a)*100,500+Math.cos(a)*240,520+Math.sin(a)*180);}
    circle(c,760,470,70);                              // head
    circle(c,780,455,10);                              // eye
    ellipse(c,300,690,70,44,0.5); ellipse(c,700,700,70,44,-0.5); // legs
    ellipse(c,300,360,60,40,-0.5);                      // front leg
  }},
];

/* ---------- Palette ---------- */
const PALETTES = {
  'Colours':['#2e2b45','#8a8aa0','#ffffff','#ff4d4d','#ff8c3b','#ffcc33','#7ed957','#33c7a1','#3ba7ff','#3b5bff','#a44bff','#ff5bb0','#ff9ec4','#8b5a2b','#c8905a'],
  'Pastel':['#ffd1dc','#ffe0b3','#fff5b8','#d6f5c8','#c8f0ee','#cfe4ff','#e2d1ff','#f3d1ff','#ffd9ec','#e8e4d0','#d9c7ff','#c4f2df'],
  'Bright':['#ff005c','#ff6f00','#ffe600','#00e676','#00e5ff','#2979ff','#7c4dff','#ff4081','#f50057','#00bfa5','#ff3d00','#651fff'],
};

/* ---------- State ---------- */
let tool = 'fill';
let color = '#ff4d4d';
let paltab = 'Colours';
let brushSize = 26;
let drawing = false;
let last = null;
const undoStack = [];

/* ---------- Build gallery ---------- */
const grid = document.getElementById('grid');
PAGES.forEach((p, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  const thumb = document.createElement('div'); thumb.className='thumb';
  const cv = document.createElement('canvas'); cv.width=300; cv.height=300;
  const tctx = cv.getContext('2d'); tctx.fillStyle='#fff'; tctx.fillRect(0,0,300,300);
  tctx.save(); tctx.scale(0.3,0.3); p.draw(tctx); tctx.restore();
  thumb.appendChild(cv);
  const label = document.createElement('div'); label.className='label'; label.textContent = p.emoji+' '+p.name;
  card.appendChild(thumb); card.appendChild(label);
  card.onclick = () => openPage(i);
  grid.appendChild(card);
});

/* ---------- Build tools ---------- */
const TOOLS = [
  {id:'fill', icon:'🪣', name:'Fill'},
  {id:'brush', icon:'🖌️', name:'Brush'},
  {id:'crayon', icon:'🖍️', name:'Crayon'},
  {id:'glitter', icon:'✨', name:'Glitter'},
  {id:'sparkle', icon:'🌟', name:'Sparkle'},
  {id:'eraser', icon:'🧽', name:'Eraser'},
];
const toolsEl = document.getElementById('tools');
TOOLS.forEach(t => {
  const b = document.createElement('button');
  b.className = 'tool'+(t.id===tool?' sel':''); b.dataset.id=t.id;
  b.innerHTML = `<span>${t.icon}</span><small>${t.name}</small>`;
  b.onclick = () => { tool=t.id; document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('sel',x.dataset.id===tool)); };
  toolsEl.appendChild(b);
});

/* ---------- Build palette tabs + swatches ---------- */
const paltabsEl = document.getElementById('paltabs');
const swatchesEl = document.getElementById('swatches');
Object.keys(PALETTES).forEach(name => {
  const b = document.createElement('button');
  b.className='paltab'+(name===paltab?' sel':''); b.textContent=name;
  b.onclick = () => { paltab=name; document.querySelectorAll('.paltab').forEach(x=>x.classList.toggle('sel',x.textContent===paltab)); renderSwatches(); };
  paltabsEl.appendChild(b);
});
function renderSwatches(){
  swatchesEl.innerHTML='';
  PALETTES[paltab].forEach(hex => {
    const s = document.createElement('div');
    s.className='sw'+(hex===color?' sel':'');
    s.style.background=hex;
    if(hex==='#ffffff') s.style.border='4px solid #ddd';
    s.onclick = () => { color=hex; document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel')); s.classList.add('sel'); };
    swatchesEl.appendChild(s);
  });
}
renderSwatches();

document.getElementById('size').oninput = e => brushSize = +e.target.value;

/* ---------- Navigation ---------- */
const galleryEl = document.getElementById('gallery');
const screenEl = document.getElementById('screen');
let currentPage = null;

function openPage(i){
  currentPage = PAGES[i];
  document.getElementById('screenTitle').textContent = currentPage.emoji+' '+currentPage.name;
  whiteBg(ctx); currentPage.draw(ctx);
  undoStack.length = 0;
  galleryEl.style.display='none';
  screenEl.classList.add('active');
  const hint=document.getElementById('hint'); hint.style.opacity='1';
  setTimeout(()=>hint.style.opacity='0', 2200);
  resizeCanvas();
}
document.getElementById('backBtn').onclick = () => {
  screenEl.classList.remove('active');
  galleryEl.style.display='block';
};

/* ---------- Undo / Clear / Save ---------- */
function pushUndo(){ try{ undoStack.push(ctx.getImageData(0,0,W,H)); if(undoStack.length>10)undoStack.shift(); }catch(e){} }
document.getElementById('undoBtn').onclick = () => { const s=undoStack.pop(); if(s)ctx.putImageData(s,0,0); };
document.getElementById('clearBtn').onclick = () => { pushUndo(); whiteBg(ctx); currentPage.draw(ctx); };
document.getElementById('saveBtn').onclick = () => {
  const a=document.createElement('a');
  a.download=(currentPage?currentPage.name:'coloring')+'.png';
  a.href=canvas.toDataURL('image/png'); a.click();
};

/* ---------- Responsive canvas sizing ---------- */
function resizeCanvas(){
  const stage = document.querySelector('.stage');
  const pad = 20;
  const avail = Math.min(stage.clientWidth-pad, stage.clientHeight-pad);
  const size = Math.max(200, avail);
  canvas.style.width = size+'px';
  canvas.style.height = size+'px';
}
window.addEventListener('resize', () => { if(screenEl.classList.contains('active')) resizeCanvas(); });

/* ---------- Pointer → canvas coords ---------- */
function pos(e){
  const r = canvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x: Math.round((p.clientX-r.left)/r.width*W), y: Math.round((p.clientY-r.top)/r.height*H) };
}

/* ---------- Flood fill ---------- */
function hexRGB(hex){ return { r:parseInt(hex.slice(1,3),16), g:parseInt(hex.slice(3,5),16), b:parseInt(hex.slice(5,7),16) }; }
function floodFill(sx, sy, fill){
  if(sx<0||sy<0||sx>=W||sy>=H) return null;
  const img = ctx.getImageData(0,0,W,H);
  const d = img.data;
  const at = (x,y)=>(y*W+x)<<2;
  const si = at(sx,sy);
  const sr=d[si], sg=d[si+1], sb=d[si+2];
  if(sr+sg+sb < 220) return null;                 // tapped an outline — ignore
  if(sr===fill.r&&sg===fill.g&&sb===fill.b) return null;
  const TOL = 62*62;
  const match = i => { const a=d[i]-sr,b=d[i+1]-sg,c=d[i+2]-sb; return a*a+b*b+c*c<=TOL; };
  const stack=[[sx,sy]];
  let minX=sx,maxX=sx,minY=sy,maxY=sy;
  while(stack.length){
    let [x,y]=stack.pop();
    let i=at(x,y);
    while(y>0 && match(i-W*4)){ y--; i-=W*4; }        // climb up
    let up=false, dn=false;
    while(y<H && match(i)){
      d[i]=fill.r; d[i+1]=fill.g; d[i+2]=fill.b; d[i+3]=255;
      if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
      if(x>0){ if(match(i-4)){ if(!up){ stack.push([x-1,y]); up=true; } } else up=false; }
      if(x<W-1){ if(match(i+4)){ if(!dn){ stack.push([x+1,y]); dn=true; } } else dn=false; }
      y++; i+=W*4;
    }
  }
  ctx.putImageData(img,0,0);
  return {minX,minY,maxX,maxY};
}

/* ---------- Sparkle / glitter drawing ---------- */
function star(x,y,r,col){
  ctx.save(); ctx.translate(x,y); ctx.fillStyle=col;
  ctx.beginPath();
  for(let i=0;i<8;i++){ const a=i*Math.PI/4; const rad=i%2?r:r*0.4; ctx[i?'lineTo':'moveTo'](Math.cos(a)*rad,Math.sin(a)*rad); }
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha=0.9; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,r*0.18,0,7); ctx.fill();
  ctx.restore();
}
/* ---------- Freehand strokes ---------- */
function stampTo(x,y){
  if(tool==='eraser'){
    ctx.save(); ctx.globalCompositeOperation='source-over'; ctx.strokeStyle='#fff'; ctx.fillStyle='#fff';
    ctx.lineWidth=brushSize*1.6; ctx.lineCap='round'; ctx.lineJoin='round';
    if(last){ ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(x,y); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(x,y,brushSize*0.8,0,7); ctx.fill();
    ctx.restore();
    // redraw the outline so the eraser never rubs away the picture lines
    currentPage.draw(ctx); return;
  }
  if(tool==='glitter'||tool==='sparkle'){
    const big = tool==='sparkle';
    const count = big?2:4;
    for(let k=0;k<count;k++){
      const jx=x+(Math.random()-0.5)*brushSize, jy=y+(Math.random()-0.5)*brushSize;
      star(jx,jy, (big?0.5:0.28)*brushSize*(0.6+Math.random()*0.6), Math.random()<0.4?'#fff':color);
    }
    return;
  }
  // brush / crayon
  ctx.save(); ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.lineWidth=brushSize;
  if(tool==='crayon'){ ctx.globalAlpha=0.55; ctx.lineWidth=brushSize*0.9; }
  if(last){ ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(x,y); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(x,y,ctx.lineWidth/2,0,7); ctx.fill();
  if(tool==='crayon'){ // grainy speckle
    for(let k=0;k<6;k++){ const a=Math.random()*7,rr=Math.random()*brushSize*0.5;
      ctx.globalAlpha=0.25; ctx.beginPath(); ctx.arc(x+Math.cos(a)*rr,y+Math.sin(a)*rr,1.5,0,7); ctx.fill(); }
  }
  ctx.restore();
}

/* ---------- Input handling ---------- */
function down(e){
  e.preventDefault();
  const {x,y}=pos(e);
  pushUndo();
  if(tool==='fill'){
    floodFill(x,y,hexRGB(color));
    return;
  }
  drawing=true; last={x,y}; stampTo(x,y); last={x,y};
}
function move(e){
  if(!drawing) return; e.preventDefault();
  const {x,y}=pos(e); stampTo(x,y); last={x,y};
}
function up(){ drawing=false; last=null; }

canvas.addEventListener('mousedown',down);
canvas.addEventListener('mousemove',move);
window.addEventListener('mouseup',up);
canvas.addEventListener('touchstart',down,{passive:false});
canvas.addEventListener('touchmove',move,{passive:false});
window.addEventListener('touchend',up);
</script>
</body>
